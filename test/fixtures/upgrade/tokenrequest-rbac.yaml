# The Role and RoleBinding which the Helm chart and static manifests stopped
# creating in v1.21. This is the workaround from the v1.20 to v1.21 upgrade
# notes for users whose Issuers use serviceAccountRef with the controller's
# own ServiceAccount. hack/verify-upgrade.sh applies it after the upgrade to
# check that it restores the permission.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-tokenrequest
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["cert-manager"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-tokenrequest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-tokenrequest
subjects:
  - kind: ServiceAccount
    name: cert-manager
